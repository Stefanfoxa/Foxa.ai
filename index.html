## 3. Logika AI (JS)

**Hapus:** `aiChunkOnce`, `aiChunk`, `aiStart` lama, `gradeAi` lama, dan baris terakhir `S.sample={json:...}`.
**Ganti dengan:**
```js
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

async function api(body,retries=2){
 for(let a=0;a<=retries;a++){
  let r;try{r=await fetch("/api/ai",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});}catch(e){if(a===retries)throw e;continue;}
  if(r.ok)return r.json();
  const e=await r.json().catch(()=>({}));
  if(r.status===429||r.status===400||a===retries)throw new Error(e.error||("api "+r.status));
  await new Promise(z=>setTimeout(z,1200*(a+1)));
 }}

async function genOne(s,avoid){
 const r=await api({task:"generate",topic:TOPICS[s.tp],ctx:CTX[s.tp],level:LV[s.d],avoid});
 return{t:s.tp,d:s.d,q:r.scenario+"\n\n"+r.question,ai:true,concepts:r.concepts||[],rubric:r.rubric||[],mistakes:r.common_mistakes||[],m:r.model_answer||""};
}

async function aiStart(){if(S.busy)return;const n=N();S.busy=true;S.lastErr="";
 const sp=[...Array(n)].map((_,k)=>spec(k,n)),out=Array(n).fill(null),avoid=[];let done=0,next=0;S.msg=`0/${n} soal…`;render();
 const worker=async()=>{while(next<n){const k=next++;
  try{out[k]=await genOne(sp[k],avoid.slice(-8));avoid.push(out[k].q.slice(0,90));}
  catch(e){S.lastErr=e.message;if(/Terlalu banyak/.test(e.message))next=n;}
  done++;S.msg=`${done}/${n} soal…`;render();}};
 await Promise.all([worker(),worker(),worker()]);
 const used=new Set(),qs=out.map((q,k)=>q||bankPick(sp[k].tp,sp[k].d,used)).filter(Boolean);S.busy=false;
 const fromBank=qs.filter(q=>!q.ai).length;
 if(!qs.length){S.msg="AI gagal: "+(S.lastErr||"tidak diketahui")+". Coba lagi atau pakai 'Acak dari bank'.";render();return;}
 start(qs,fromBank?`${fromBank}/${qs.length} soal dari bank offline (alasan: ${S.lastErr||"AI gagal"}).`:"");}

async function gradeAi(q,a){
 const r=await api({task:"grade",ctx:CTX[q.t],question:q.q,answer:a,concepts:q.c?q.c.map(x=>x[0]):q.concepts||[],rubric:q.rubric||[],mistakes:q.mistakes||[],model:q.m||""});
 return{score:Math.max(0,Math.min(100,Math.round(+r.score||0))),covered:r.covered||[],missed:[...(r.missed||[]),...(r.misconceptions||[]).map(x=>"Keliru: "+x)],feedback:r.feedback||"",rec:r.recommendations||[],verdict:r.verdict,criteria:r.criteria||[]};}
```
Di akhir script, ganti baris `S.sample={json:...}` dengan: `S.sample=true;render();`
